name: Build Raspberry Pi Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to attach the .deb to (e.g. v1.0.0)'
        required: true
      upload_to_release:
        description: 'Upload .deb to existing GitHub release? (true/false)'
        required: false
        default: 'true'
  push:
    tags:
      # e.g. v1.0.0-pi, v1.0.0-pi2 → builds this commit, attaches to release
      # v1.0.0. The numeric suffix allows re-triggering with a fresh tag.
      # (release.yml excludes these tags so only this workflow runs.)
      - 'v*.*.*-pi*'

# Native ARM64 runner (free for public repos since Jan 2025) — QEMU
# emulation segfaults on torch import and took 45-90 min; native takes ~15.
# ubuntu-22.04-arm has glibc 2.35 < Pi OS Bookworm's 2.36, so the
# PyInstaller output runs on the Pi.

jobs:
  build-pi:
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        # APP_VERSION (deb version) comes from the VERSION file — dpkg
        # requires a digit-leading version, never the v-prefixed git tag.
        # RELEASE_TAG is the release the .deb gets attached to.
        run: |
          echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME%-pi*}" >> $GITHUB_ENV
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-xinerama0 \
            dpkg-dev binutils xvfb

      - name: Install CPU-only torch
        # Fall back to PyPI (aarch64 wheels there are CPU-only anyway) if
        # the cpu index has no aarch64 build for this Python.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu \
            || pip install torch

      - name: Install dependencies (no PyQt6 — headless Pi build)
        # PyQt6 aarch64 wheels need glibc >= 2.39 (Pi OS Bookworm has 2.36)
        # and the pinned 6.7.0 has no aarch64 wheel at all. The Pi build is
        # headless; the launcher serves the web UI to the system browser.
        run: |
          grep -viE '^pyqt6' requirements.txt > /tmp/requirements-pi.txt
          pip install pyinstaller -r /tmp/requirements-pi.txt \
            transformers open-clip-torch ultralytics huggingface_hub

      - name: Build with PyInstaller (headless display)
        run: |
          Xvfb :99 &
          DISPLAY=:99 pyinstaller build/cctv_processor_linux.spec

      - name: Create .deb
        # Output tail is surfaced as a ::error:: annotation so failures are
        # diagnosable from the public checks API.
        run: |
          set +e
          out=$(bash build/pi/create_deb.sh 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error title=create_deb.sh failed with exit ${code}::$(echo "$out" | tail -n 12 | tr '\n' '|')"
            exit $code
          fi
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: List dist artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pi-deb
          path: dist/cctv-video-processor_*_arm64.deb

      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/cctv-video-processor_*_arm64.deb
