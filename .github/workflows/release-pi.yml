name: Build Raspberry Pi Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to attach the .deb to (e.g. v1.0.0)'
        required: true
      upload_to_release:
        description: 'Upload .deb to existing GitHub release? (true/false)'
        required: false
        default: 'true'
  push:
    tags:
      # e.g. v1.0.0-pi, v1.0.0-pi2 → builds this commit, attaches to release
      # v1.0.0. The numeric suffix allows re-triggering with a fresh tag.
      - 'v*.*.*-pi*'

# Pi build is kept out of the main release workflow to avoid blocking it:
# QEMU emulated ARM64 builds take 45-90 minutes.

jobs:
  build-pi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Resolve versions
        # APP_VERSION (deb version) comes from the VERSION file — dpkg
        # requires a digit-leading version, never the v-prefixed git tag.
        # RELEASE_TAG is the release the .deb gets attached to.
        run: |
          echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME%-pi*}" >> $GITHUB_ENV
          fi

      - name: Build inside QEMU ARM64 (Raspberry Pi emulation)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -qq
            # gcc + python3.11-dev: pinned deps without aarch64 wheels
            # (e.g. psutil 5.9.8) are built from source by pip.
            apt-get install -y python3.11 python3.11-venv python3.11-dev python3-pip \
              gcc libgl1 libglib2.0-0 libxcb-xinerama0 \
              dpkg-dev binutils xvfb
            python3.11 -m pip install --upgrade pip setuptools wheel
          run: |
            set -euo pipefail
            exec > >(tee /tmp/build.log) 2>&1
            on_err() { echo "::error title=Pi build failed::$(tail -n 12 /tmp/build.log | tr '\n' '|')"; }
            trap on_err ERR

            # dpkg requires a digit-leading version — use the VERSION file.
            export APP_VERSION="$(cat VERSION)"

            # Use python3.11 explicitly — bare `pip`/`pyinstaller` resolve to
            # the system Python 3.10 install and would build with the wrong
            # interpreter.
            # CPU-only torch for ARM64; fall back to PyPI (aarch64 wheels
            # there are CPU-only anyway) if the cpu index has no aarch64 build.
            python3.11 -m pip install torch --index-url https://download.pytorch.org/whl/cpu \
              || python3.11 -m pip install torch

            # Install project dependencies — WITHOUT PyQt6: its aarch64
            # wheels need glibc >= 2.39 (Pi OS Bookworm has 2.36) and 6.7.0
            # has no aarch64 wheel at all. The Pi build is headless; the
            # launcher serves the web UI to the system browser instead.
            grep -viE '^pyqt6' requirements.txt > /tmp/requirements-pi.txt
            python3.11 -m pip install pyinstaller -r /tmp/requirements-pi.txt \
              transformers open-clip-torch ultralytics huggingface_hub

            # Build with PyInstaller (headless)
            Xvfb :99 & export DISPLAY=:99
            python3.11 -m PyInstaller build/cctv_processor_linux.spec

            # Create .deb
            bash build/pi/create_deb.sh

            echo "Build complete"

      - name: List dist artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pi-deb
          path: dist/cctv-video-processor_*_arm64.deb

      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/cctv-video-processor_*_arm64.deb
