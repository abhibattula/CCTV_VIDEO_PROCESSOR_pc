name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      # Pi build-trigger tags (v1.0.0-pi, v1.0.0-pi2, …) belong to
      # release-pi.yml only — without this exclusion they also match
      # v*.*.* and spawn a full desktop release run + junk release.
      - '!v*.*.*-pi*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: true
        default: 'dev'

env:
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}

jobs:
  # ── Windows x64 (.exe via Inno Setup) ─────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        shell: bash
        run: echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only torch first (prevents CUDA download)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt transformers open-clip-torch ultralytics huggingface_hub

      - name: Build with PyInstaller
        run: pyinstaller build/cctv_processor_windows.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        # Output tail is surfaced as a ::error:: annotation so compile
        # failures are diagnosable from the public checks API.
        run: |
          Get-PSDrive C | Format-Table -AutoSize | Out-String | Write-Host
          if (-not (Test-Path "dist/CCTV-Video-Processor")) {
            Write-Host "::error title=Installer input missing::dist/CCTV-Video-Processor not found after PyInstaller"
            exit 1
          }
          Remove-Item build\cctv_processor_windows -Recurse -Force -ErrorAction SilentlyContinue
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          $out = & $iscc "/DAppVersion=$env:APP_VERSION" build\windows\installer.iss 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`r?`n") | Where-Object { $_ } | Select-Object -Last 12) -join ' || '
            Write-Host "::error title=ISCC failed with exit $LASTEXITCODE::$tail"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/CCTV-Processor-*-win64-setup.exe

  # ── macOS ARM64 (Apple Silicon) ────────────────────────────────────────────
  build-macos-arm:
    runs-on: macos-14
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        run: echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt transformers open-clip-torch ultralytics huggingface_hub

      - name: Build with PyInstaller
        run: pyinstaller build/cctv_processor_macos.spec

      - name: Create DMG
        run: bash build/macos/create_dmg.sh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Rename artifact
        run: mv dist/CCTV-Video-Processor-*-macos.dmg dist/CCTV-Video-Processor-${{ env.APP_VERSION }}-macos-arm64.dmg || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-dmg
          path: dist/CCTV-Video-Processor-*-macos-arm64.dmg

  # ── macOS Intel ────────────────────────────────────────────────────────────
  # macos-13 (the old Intel runner) was retired 2025-12-04; macos-15-intel is
  # the free x86_64 replacement until Fall 2027.
  build-macos-intel:
    runs-on: macos-15-intel
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        run: echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt transformers open-clip-torch ultralytics huggingface_hub

      - name: Build with PyInstaller
        run: pyinstaller build/cctv_processor_macos.spec

      - name: Create DMG
        run: bash build/macos/create_dmg.sh
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Rename artifact
        run: mv dist/CCTV-Video-Processor-*-macos.dmg dist/CCTV-Video-Processor-${{ env.APP_VERSION }}-macos-intel.dmg || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: dist/CCTV-Video-Processor-*-macos-intel.dmg

  # ── Linux x86_64 (.AppImage) ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        run: echo "APP_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libxcb-xinerama0 xvfb

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt transformers open-clip-torch ultralytics huggingface_hub

      - name: Build with PyInstaller (headless display)
        run: |
          Xvfb :99 &
          DISPLAY=:99 pyinstaller build/cctv_processor_linux.spec

      - name: Create AppImage
        # Output tail is surfaced as a ::error:: annotation so failures are
        # diagnosable from the public checks API.
        run: |
          set +e
          out=$(bash build/linux/create_appimage.sh 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            tail_msg=$(echo "$out" | tail -n 12 | tr '\n' '|')
            echo "::error title=create_appimage.sh failed with exit ${code}::${tail_msg}"
            exit $code
          fi
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/CCTV-Video-Processor-*-linux-x86_64.AppImage

  # ── Collect all artifacts → GitHub Release ─────────────────────────────────
  release:
    needs: [build-windows, build-macos-arm, build-macos-intel, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CCTV Video Processor ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## CCTV Video Processor ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows 10/11 x64 | `*-win64-setup.exe` | Inno Setup installer |
            | macOS Apple Silicon | `*-macos-arm64.dmg` | Ad-hoc signed, right-click → Open |
            | macOS Intel | `*-macos-intel.dmg` | Ad-hoc signed, right-click → Open |
            | Linux x86_64 | `*-linux-x86_64.AppImage` | chmod +x then run |
            | Raspberry Pi 4/5 | See [release-pi.yml](.github/workflows/release-pi.yml) | Manual dispatch |

            ### First-run
            The app downloads AI model weights (~1 GB) on first launch via the setup wizard.
            An internet connection is required for the initial setup; the app works offline thereafter.

            ### macOS Gatekeeper
            Right-click the app → Open → Open to bypass Gatekeeper on first launch.
          files: release-assets/*
